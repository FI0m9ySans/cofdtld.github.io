<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cofdtld Learner · Cofdtld 学习器</title>
<style>
:root{
  --bg:#0e1116;--panel:#161b22;--panel2:#1d242e;--line:#2b3542;
  --text:#e6edf5;--muted:#8b9bb0;--accent:#6ee7b7;--accent2:#38bdf8;
  --warn:#fbbf24;--bad:#f87171;--good:#34d399;--radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(1100px 550px at 15% -10%,#1a2b3c 0%,transparent 60%),var(--bg);
  color:var(--text);min-height:100vh;line-height:1.5;
}
a{color:var(--accent2)}
header{
  position:sticky;top:0;z-index:10;
  background:rgba(14,17,22,.85);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.header-inner{
  max-width:960px;margin:0 auto;padding:12px 16px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.logo{font-weight:800;letter-spacing:.5px;font-size:18px}
.logo span{color:var(--accent)}
.spacer{flex:1}
.lang-switch{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang-switch button{
  background:transparent;color:var(--muted);border:0;padding:5px 12px;
  font-size:13px;cursor:pointer;font-weight:600;
}
.lang-switch button.active{background:var(--accent);color:#06281c}
nav{
  max-width:960px;margin:0 auto;padding:0 16px 10px;
  display:flex;gap:6px;overflow-x:auto;
}
nav button{
  background:var(--panel);color:var(--muted);border:1px solid var(--line);
  padding:7px 14px;border-radius:999px;font-size:13px;cursor:pointer;
  white-space:nowrap;font-weight:600;transition:.15s;
}
nav button.active{background:var(--accent2);color:#04121c;border-color:var(--accent2)}
main{max-width:960px;margin:0 auto;padding:20px 16px 80px}
.view{display:none}
.view.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 12px;color:var(--muted);font-weight:600}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin-bottom:16px;
}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
.stat{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;text-align:center;
}
.stat .num{font-size:26px;font-weight:800;color:var(--accent)}
.stat .lbl{font-size:12px;color:var(--muted);margin-top:2px}
.btn{
  background:var(--accent);color:#06281c;border:0;padding:10px 18px;
  border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;transition:.15s;
}
.btn:hover{filter:brightness(1.08)}
.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.big{padding:14px 26px;font-size:16px;width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
/* Card */
.card{perspective:1200px;cursor:pointer;margin-bottom:16px}
.card-inner{
  position:relative;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,.2,.2,1);
  min-height:230px;
}
.card.flipped .card-inner{transform:rotateY(180deg)}
.card-face{
  position:absolute;inset:0;backface-visibility:hidden;
  background:linear-gradient(160deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:18px;padding:24px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;overflow:auto;
}
.card-face.back{transform:rotateY(180deg)}
.word{font-size:38px;font-weight:800;letter-spacing:1px;color:var(--accent)}
.mnem{font-size:14px;color:var(--muted);margin-top:6px}
.pos-tag{
  display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);color:var(--muted);margin-top:10px;
}
.mean{font-size:22px;font-weight:700;margin-bottom:6px}
.ex{margin-top:14px;font-size:14px;color:var(--muted);line-height:1.7;max-width:520px}
.ex .c{color:var(--accent2);font-weight:600}
.hint{font-size:12px;color:var(--muted);margin-top:16px}
/* Quiz */
.q-head{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:14px}
.q-prompt{font-size:26px;font-weight:800;text-align:center;margin:12px 0 22px;min-height:40px}
.q-prompt .lbl{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:6px}
.options{display:grid;gap:10px}
.option{
  background:var(--panel2);border:1px solid var(--line);color:var(--text);
  padding:14px 16px;border-radius:12px;font-size:15px;cursor:pointer;
  text-align:left;transition:.12s;font-weight:600;
}
.option:hover:not(:disabled){border-color:var(--accent2)}
.option.correct{background:rgba(52,211,153,.18);border-color:var(--good);color:var(--good)}
.option.wrong{background:rgba(248,113,113,.18);border-color:var(--bad);color:var(--bad)}
.option:disabled{cursor:default}
.feedback{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:14px;display:none}
.feedback.show{display:block}
.feedback.ok{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4);color:var(--good)}
.feedback.no{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.4);color:var(--bad)}
/* Dictionary */
.search{
  width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel2);color:var(--text);font-size:14px;margin-bottom:14px;
}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{
  background:var(--panel2);border:1px solid var(--line);color:var(--muted);
  padding:5px 12px;border-radius:999px;font-size:12px;cursor:pointer;font-weight:600;
}
.chip.active{background:var(--accent2);color:#04121c;border-color:var(--accent2)}
.dict-list{display:grid;gap:8px}
.dict-item{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;
}
.dict-item .w{font-size:16px;font-weight:800;color:var(--accent);min-width:90px}
.dict-item .m{font-size:14px;flex:1}
.dict-item .meta{font-size:11px;color:var(--muted)}
/* Phrase */
.phrase{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;margin-bottom:10px;
}
.phrase .c{font-size:17px;font-weight:700;color:var(--accent2);margin-bottom:4px}
.phrase .t{font-size:14px}
.phrase .e{font-size:13px;color:var(--muted);margin-top:2px}
/* Progress bar */
.pbar{height:6px;background:var(--panel2);border-radius:999px;overflow:hidden;margin-top:8px}
.pbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .3s}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
@media(max-width:520px){
  .word{font-size:30px}
  .q-prompt{font-size:21px}
  .card-face{min-height:210px}
}
</style>
</head>

/* =====================================================================
   STATE
   ===================================================================== */
const STORAGE_KEY = "cofdtld_learner_v1";
const BOX_DAYS = [0, 1, 2, 4, 7, 15]; // box 1..6 -> days until next review
const DAY_MS = 86400000;

let state = {
  lang: (navigator.language || "zh").toLowerCase().startsWith("zh") ? "zh" : "en",
  view: "dashboard",
  progress: {},   // w -> {box, nextReview, correct, wrong, learnedAt}
  dictFilter: "all",
  dictQuery: ""
};

let session = null; // active learn/review/quiz session
let flash = null;   // transient quiz feedback

function t(key){
  const parts = key.split(".");
  let v = I18N[state.lang];
  for(const p of parts){ if(v==null) return key; v = v[p]; }
  return v ?? key;
}
function fmt(str, obj){
  return str.replace(/\{(\w+)\}/g, (_,k)=> obj[k] ?? "");
}
function $(sel){ return document.querySelector(sel); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      lang: state.lang, progress: state.progress
    }));
  }catch(e){ /* ignore */ }
}
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(d.lang) state.lang = d.lang;
    if(d.progress) state.progress = d.progress;
  }catch(e){ /* ignore */ }
}

/* =====================================================================
   HELPERS
   ===================================================================== */
function shuffle(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [r[i],r[j]] = [r[j],r[i]];
  }
  return r;
}
function meaning(w, lang){
  return (lang==="zh" ? w.zh : w.en).join(" / ");
}
function dueWords(){
  const now = Date.now();
  return WORDS.filter(w=>{
    const p = state.progress[w.w];
    return p && p.nextReview <= now;
  });
}
function learnedWords(){
  return WORDS.filter(w=> state.progress[w.w]);
}
function newWords(){
  return WORDS.filter(w=> !state.progress[w.w]);
}
function boxOf(w){
  const p = state.progress[w.w];
  return p ? p.box : 0;
}
function recordAnswer(w, correct){
  const p = state.progress[w.w] || {box:1, nextReview:Date.now(), correct:0, wrong:0, learnedAt:Date.now()};
  if(correct){
    p.box = Math.min(6, p.box + 1);
    p.correct = (p.correct||0) + 1;
  }else{
    p.box = 1;
    p.wrong = (p.wrong||0) + 1;
  }
  p.nextReview = Date.now() + BOX_DAYS[p.box-1] * DAY_MS;
  state.progress[w.w] = p;
  save();
}
function markLearned(w){
  if(state.progress[w.w]) return;
  state.progress[w.w] = {box:1, nextReview:Date.now(), correct:0, wrong:0, learnedAt:Date.now()};
  save();
}

  state.view = v;

    return `<button class="${state.view===k?"active":""}" onclick="setView('${k}')">${t(label)}${badge}</button>`;
  }).join("");
}

/* =====================================================================
   LEARN
   ===================================================================== */
const LEARN_BATCH = 5;

function startLearn(){
  const pool = newWords();
  if(pool.length === 0){ session = {mode:"learn", empty:true}; render(); return; }
  // prefer core words first
  const core = pool.filter(w=>w.core);
  const rest = pool.filter(w=>!w.core);
  const picked = [...shuffle(core), ...shuffle(rest)].slice(0, LEARN_BATCH);
  session = {
    mode:"learn",
    queue: picked,
    idx: 0,
    flipped: false,
    done: false
  };
  render();
}
function flipCard(){
  if(!session || session.mode!=="learn" || session.done) return;
  session.flipped = !session.flipped;
  render();
}
function learnNext(){
  if(!session) return;
  const w = session.queue[session.idx];
  markLearned(w);
  session.idx++;
  session.flipped = false;
  if(session.idx >= session.queue.length){
    session.done = true;
  }
  render();
}

function renderLearn(){
  const el = $("#view-learn");
  if(!session || session.mode!=="learn"){
    el.innerHTML = `
      <h1>${esc(t("learnTitle"))}</h1>
      <p class="sub">${esc(t("learnDesc"))}</p>
      <div class="panel">
        <button class="btn big" onclick="startLearn()">${esc(t("startLearn"))}</button>
      </div>`;
    return;
  }
  if(session.empty){
    el.innerHTML = `
      <h1>${esc(t("learnTitle"))}</h1>
      <div class="panel empty">${esc(t("noNew"))}</div>
      <button class="btn secondary" onclick="setView('review')">${esc(t("startReview"))}</button>`;
    return;
  }
  if(session.done){
    el.innerHTML = `
      <h1>${esc(t("learnDone"))}</h1>
      <p class="sub">${esc(t("learnDoneDesc"))}</p>
      <div class="panel">
        <div class="btn-row">
          <button class="btn" onclick="startLearn()">${esc(t("startNext"))}</button>
          <button class="btn secondary" onclick="setView('dashboard')">${esc(t("backHome"))}</button>
        </div>
      </div>`;
    return;
  }

  const w = session.queue[session.idx];
  const total = session.queue.length;
  const i = session.idx + 1;
  const lang = state.lang;
  const m = meaning(w, lang);
  const pos = lang==="zh" ? (POS_ZH[w.pos]||w.pos) : (POS_EN[w.pos]||w.pos);
  const cat = lang==="zh" ? (CAT_ZH[w.cat]||w.cat) : (CAT_EN[w.cat]||w.cat);
  const ex = w.ex ? `<div class="ex">
      <div class="c">${esc(w.ex.c)}</div>
      <div>${esc(lang==="zh"?w.ex.z:w.ex.e)}</div>
    </div>` : "";
  const mn = lang==="zh" ? `<div class="mnem">谐音：${esc(w.mn)}</div>` : "";

  el.innerHTML = `
    <div class="q-head"><span>${esc(t("learnTitle"))}</span><span>${i} / ${total}</span></div>
    <div class="pbar"><i style="width:${(i-1)/total*100}%"></i></div>
    <div style="height:16px"></div>
    <div class="card ${session.flipped?'flipped':''}" onclick="flipCard()">
      <div class="card-inner">
        <div class="card-face front">
          <div class="word">${esc(w.w)}</div>
          ${mn}
          <div class="pos-tag">${esc(pos)} · ${esc(cat)}</div>
          <div class="hint">${esc(t("flipHint"))}</div>
        </div>
        <div class="card-face back">
          <div class="mean">${esc(m)}</div>
          ${mn}
          ${ex}
        </div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn big" onclick="learnNext()">${i===total?esc(t("finish")):esc(t("next"))}</button>
    </div>
  `;
}

/* =====================================================================
   REVIEW
   ===================================================================== */
const REVIEW_BATCH = 10;

function startReview(){
  const due = dueWords();
  if(due.length === 0){ session = {mode:"review", empty:true}; render(); return; }
  const picked = shuffle(due).slice(0, REVIEW_BATCH);
  session = {
    mode:"review",
    queue: picked,
    idx: 0,
    answered: false,
    chosen: null,
    correctCount: 0,
    wrongCount: 0,
    question: null,
    done: false
  };
  buildReviewQuestion();
  render();
}

function buildReviewQuestion(){
  if(!session || session.mode!=="review") return;
  const w = session.queue[session.idx];
  if(!w) return;
  const lang = state.lang;
  // half the time: Cofdtld -> meaning ; half: meaning -> Cofdtld
  const dir = Math.random() < 0.5 ? "toMeaning" : "toWord";
  let options;
  if(dir === "toMeaning"){
    options = makeOptions(w, x => meaning(x, lang));
    session.question = {
      dir,
      prompt: w.w,
      promptLabel: "",
      options,
      answerValue: meaning(w, lang)
    };
  }else{
    options = makeOptions(w, x => x.w);
    session.question = {
      dir,
      prompt: meaning(w, lang),
      promptLabel: "",
      options,
      answerValue: w.w
    };
  }
  session.answered = false;
  session.chosen = null;
}

function makeOptions(correctWord, valueFn, n=4){
  const others = WORDS.filter(x=>x.w !== correctWord.w);
  const sameCat = others.filter(x=>x.cat === correctWord.cat);
  const pool = sameCat.length >= n-1 ? sameCat : others;
  const picked = shuffle(pool).slice(0, n-1);
  const all = [correctWord, ...picked].map(x=>({w:x, val: valueFn(x)}));
  return shuffle(all);
}

function answerReview(val){
  if(!session || session.mode!=="review" || session.answered) return;
  const q = session.question;
  const w = session.queue[session.idx];
  const ok = val === q.answerValue;
  session.chosen = val;
  session.answered = true;
  if(ok){ session.correctCount++; } else { session.wrongCount++; }
  recordAnswer(w, ok);
  render();
}
function nextReview(){
  if(!session || session.mode!=="review") return;
  session.idx++;
  if(session.idx >= session.queue.length){
    session.done = true;
  }else{
    buildReviewQuestion();
  }
  render();
}

function renderReview(){
  const el = $("#view-review");
  if(!session || session.mode!=="review"){
    const due = dueWords().length;
    el.innerHTML = `
      <h1>${esc(t("reviewTitle"))}</h1>
      <p class="sub">${esc(t("reviewDesc"))}</p>
      <div class="panel">
        <p style="margin:0 0 14px;color:${due>0?'var(--warn)':'var(--muted)'};font-weight:700">
          ${due>0 ? esc(fmt(t("dueCount"),{n:due})) : esc(t("noDueShort"))}
        </p>
        <button class="btn big" onclick="startReview()" ${due===0?'disabled style="opacity:.5;cursor:not-allowed"':''}>
          ${esc(t("startReview"))}
        </button>
      </div>`;
    return;
  }
  if(session.empty){
    el.innerHTML = `
      <h1>${esc(t("reviewTitle"))}</h1>
      <div class="panel empty">${esc(t("noDue"))}</div>
      <div class="btn-row">
        <button class="btn" onclick="setView('learn')">${esc(t("startLearn"))}</button>
        <button class="btn secondary" onclick="setView('quiz')">${esc(t("startQuiz"))}</button>
      </div>`;
    return;
  }
  if(session.done){
    el.innerHTML = `
      <h1>${esc(t("sessionDone"))}</h1>
      <p class="sub">${esc(fmt(t("sessionStats"),{c:session.correctCount,w:session.wrongCount}))}</p>
      <div class="panel">
        <div class="btn-row">
          <button class="btn" onclick="startReview()">${esc(t("startNext"))}</button>
          <button class="btn secondary" onclick="setView('dashboard')">${esc(t("backHome"))}</button>
        </div>
      </div>`;
    return;
  }

  const q = session.question;
  const total = session.queue.length;
  const i = session.idx + 1;
  const lang = state.lang;
  const promptLabel = q.dir === "toMeaning" ? t("questionWhat") : t("questionHow");

  const optsHtml = q.options.map(o=>{
    let cls = "option";
    if(session.answered){
      if(o.val === q.answerValue) cls += " correct";
      else if(o.val === session.chosen) cls += " wrong";
    }
    return `<button class="${cls}" onclick="answerReview(${JSON.stringify(o.val).replace(/"/g,'&quot;')})"
      ${session.answered?'disabled':''}>${esc(o.val)}</button>`;
  }).join("");

  let fb = "";
  if(session.answered){
    const ok = session.chosen === q.answerValue;
    fb = `<div class="feedback show ${ok?'ok':'no'}">
      ${ok ? esc(t("correct")) : esc(t("wrong")) + " " + esc(q.answerValue)}
    </div>`;
  }

  el.innerHTML = `
    <div class="q-head"><span>${esc(t("reviewTitle"))}</span><span>${esc(fmt(t("qProgress"),{i,n:total}))}</span></div>
    <div class="pbar"><i style="width:${(i-1)/total*100}%"></i></div>
    <div style="height:16px"></div>
    <div class="q-prompt">
      <span class="lbl">${esc(promptLabel)}</span>
      ${esc(q.prompt)}
    </div>
    <div class="options">${optsHtml}</div>
    ${fb}
    ${session.answered ? `<div style="height:14px"></div>
      <button class="btn big" onclick="nextReview()">${esc(t("continueBtn"))}</button>` : ""}
  `;
}

/* =====================================================================
   QUIZ
   ===================================================================== */
const QUIZ_BATCH = 10;

function startQuiz(){
  const pool = learnedWords();
  const source = pool.length >= 4 ? pool : WORDS;
  const picked = shuffle(source).slice(0, QUIZ_BATCH);
  session = {
    mode:"quiz",
    queue: picked,
    idx: 0,
    answered: false,
    chosen: null,
    correctCount: 0,
    wrongCount: 0,
    question: null,
    done: false
  };
  buildQuizQuestion();
  render();
}
function buildQuizQuestion(){
  if(!session || session.mode!=="quiz") return;
  const w = session.queue[session.idx];
  const lang = state.lang;
  const dir = Math.random() < 0.5 ? "toMeaning" : "toWord";
  if(dir === "toMeaning"){
    session.question = {
      dir,
      prompt: w.w,
      answerValue: meaning(w, lang),
      options: makeOptions(w, x=>meaning(x, lang))
    };
  }else{
    session.question = {
      dir,
      prompt: meaning(w, lang),
      answerValue: w.w,
      options: makeOptions(w, x=>x.w)
    };
  }
  session.answered = false;
  session.chosen = null;
}
function answerQuiz(val){
  if(!session || session.mode!=="quiz" || session.answered) return;
  const q = session.question;
  const ok = val === q.answerValue;
  session.chosen = val;
  session.answered = true;
  if(ok) session.correctCount++; else session.wrongCount++;
  render();
}
function nextQuiz(){
  if(!session || session.mode!=="quiz") return;
  session.idx++;
  if(session.idx >= session.queue.length) session.done = true;
  else buildQuizQuestion();
  render();
}

function renderQuiz(){
  const el = $("#view-quiz");
  if(!session || session.mode!=="quiz"){
    el.innerHTML = `
      <h1>${esc(t("quizTitle"))}</h1>
      <p class="sub">${esc(t("quizDesc"))}</p>
      <div class="panel">
        <button class="btn big" onclick="startQuiz()">${esc(t("startQuiz"))}</button>
      </div>`;
    return;
  }
  if(session.done){
    el.innerHTML = `
      <h1>${esc(t("sessionDone"))}</h1>
      <p class="sub">${esc(fmt(t("sessionStats"),{c:session.correctCount,w:session.wrongCount}))}</p>
      <div class="panel">
        <div class="btn-row">
          <button class="btn" onclick="startQuiz()">${esc(t("startNext"))}</button>
          <button class="btn secondary" onclick="setView('dashboard')">${esc(t("backHome"))}</button>
        </div>
      </div>`;
    return;
  }
  const q = session.question;
  const total = session.queue.length;
  const i = session.idx + 1;
  const promptLabel = q.dir === "toMeaning" ? t("questionWhat") : t("questionHow");
  const optsHtml = q.options.map(o=>{
    let cls = "option";
    if(session.answered){
      if(o.val === q.answerValue) cls += " correct";
      else if(o.val === session.chosen) cls += " wrong";
    }
    return `<button class="${cls}" onclick="answerQuiz(${JSON.stringify(o.val).replace(/"/g,'&quot;')})"
      ${session.answered?'disabled':''}>${esc(o.val)}</button>`;
  }).join("");
  let fb = "";
  if(session.answered){
    const ok = session.chosen === q.answerValue;
    fb = `<div class="feedback show ${ok?'ok':'no'}">
      ${ok ? esc(t("correct")) : esc(t("wrong")) + " " + esc(q.answerValue)}
    </div>`;
  }
  el.innerHTML = `
    <div class="q-head"><span>${esc(t("quizTitle"))}</span><span>${esc(fmt(t("qProgress"),{i,n:total}))}</span></div>
    <div class="pbar"><i style="width:${(i-1)/total*100}%"></i></div>
    <div style="height:16px"></div>
    <div class="q-prompt"><span class="lbl">${esc(promptLabel)}</span>${esc(q.prompt)}</div>
    <div class="options">${optsHtml}</div>
    ${fb}
    ${session.answered ? `<div style="height:14px"></div>
      <button class="btn big" onclick="nextQuiz()">${esc(t("continueBtn"))}</button>` : ""}
  `;
}

/* =====================================================================
   DICTIONARY
   ===================================================================== */
function setDictFilter(f){ state.dictFilter = f; renderDict(); }
function setDictQuery(q){ state.dictQuery = q; renderDict(); }

function renderDict(){
  const el = $("#view-dict");
  const lang = state.lang;
  const filters = [
    ["all", t("all")],
    ["core", t("core")],
    ["func", t("func")],
    ["greeting","greeting"],
    ["pronoun","pronoun"],
    ["nature","nature"],
    ["people","people"],
    ["abstract","abstract"],
    ["action","action"],
    ["adj","adj"],
    ["num","num"]
  ];
  let list = WORDS.slice();
  if(state.dictFilter === "core") list = list.filter(w=>w.core);
  else if(state.dictFilter === "func") list = list.filter(w=>!w.core || w.cat==="func");
  else if(state.dictFilter !== "all") list = list.filter(w=>w.cat === state.dictFilter);

  const q = state.dictQuery.trim().toLowerCase();
  if(q){
    list = list.filter(w=>
      w.w.toLowerCase().includes(q) ||
      w.en.some(e=>e.toLowerCase().includes(q)) ||
      w.zh.some(z=>z.includes(q))
    );
  }

  const chips = filters.map(([k,label])=>
    `<button class="chip ${state.dictFilter===k?'active':''}" onclick="setDictFilter('${k}')">${esc(label)}</button>`
  ).join("");

  const items = list.map(w=>{
    const pos = lang==="zh" ? (POS_ZH[w.pos]||w.pos) : (POS_EN[w.pos]||w.pos);
    const cat = lang==="zh" ? (CAT_ZH[w.cat]||w.cat) : (CAT_EN[w.cat]||w.cat);
    const mn = lang==="zh" ? `<span class="meta">谐音：${esc(w.mn)}</span>` : "";
    return `<div class="dict-item">
      <div class="w">${esc(w.w)}</div>
      <div class="m">${esc(meaning(w,lang))}</div>
      <div class="meta">${esc(pos)} · ${esc(cat)} ${w.core?'· ★':''}</div>
      ${mn}
    </div>`;
  }).join("");

  el.innerHTML = `
    <h1>${esc(t("dictTitle"))}</h1>
    <p class="sub">${esc(t("dictDesc"))}</p>
    <input class="search" placeholder="${esc(t("searchPlaceholder"))}"
      value="${esc(state.dictQuery)}"
      oninput="setDictQuery(this.value)">
    <div class="chips">${chips}</div>
    <div class="dict-list">
      ${items || `<div class="empty">${esc(t("noResult"))}</div>`}
    </div>
  `;
}

/* =====================================================================
   PHRASES
   ===================================================================== */
function renderPhrases(){
  const el = $("#view-phrases");
  const lang = state.lang;
  const items = PHRASES.map(p=>`
    <div class="phrase">
      <div class="c">${esc(p.c)}</div>
      <div class="t">${esc(lang==="zh"?p.z:p.e)}</div>
      ${lang==="zh" ? `<div class="e">${esc(p.e)}</div>` : `<div class="e">${esc(p.z)}</div>`}
    </div>`).join("");
  el.innerHTML = `
    <h1>${esc(t("phrasesTitle"))}</h1>
    <p class="sub">${esc(t("phrasesDesc"))}</p>
    ${items}
  `;
}

/* =====================================================================
   RENDER
   ===================================================================== */
function render(){
  document.documentElement.lang = state.lang==="zh" ? "zh-CN" : "en";
  document.getElementById("lang-zh").classList.toggle("active", state.lang==="zh");
  document.getElementById("lang-en").classList.toggle("active", state.lang==="en");
  renderNav();

  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  const viewEl = document.getElementById("view-"+state.view);
  if(viewEl) viewEl.classList.add("active");

  if(state.view==="dashboard") renderDashboard();
  else if(state.view==="learn") renderLearn();
  else if(state.view==="review") renderReview();
  else if(state.view==="quiz") renderQuiz();
  else if(state.view==="dict") renderDict();
  else if(state.view==="phrases") renderPhrases();
}

/* =====================================================================
   BOOT
   ===================================================================== */
load();
render();
</script>
</body>
</html>
